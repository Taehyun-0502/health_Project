spring:
  application:
    name: app
    
  profiles:
    include: dev
    
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # test또는 대량 insert시 cash충돌 해결방법
        prepareThreshold: 0
        
  servlet:
    multipart:
      # multipart 사용여부
      enabled: true
      # 파일 하나당 최대크기 설정
      max-file-size: 10MB
      # 총 파일의 최대크기 설정
      max-request-size: 100MB

app:
  server:
    backend-url: ${BACKEND_SERVER_URL}
    frontend-url: ${FRONTEND_SERVER_URL}
  upload:
    # 파일을 저장 관리
    base: C:/upload/health
    # 클라이언트가 파일을 달라고할때 여기서 찾아줘라 라는 경로
    path: file:///C:/upload/health/
    # 파일에 접근하기위한 가상의 URI 만들기 위에가서찾으세요
    url: /files/**

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.health.app

  jwt:
  secret: ${JWT_SECRET_KEY}